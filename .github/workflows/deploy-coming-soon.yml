# Publishes Puls's "coming soon" page to the free Static Web App puls-coming-soon in rg-puls-za, which mypuls.co.za
# points at. Puls's app is not deployed until it is ready; this is one HTML file and its icon, published as they are,
# on a merge that changes them and from the button. The deployment token is the repository secret
# PULS_COMING_SOON_TOKEN (az staticwebapp secrets list). Moved here from louis-agent with Puls (F166.3).
name: Deploy the coming-soon page

on:
  push:
    branches: [ main ]
    paths: [ 'coming-soon/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the page
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.PULS_COMING_SOON_TOKEN }}
          action: upload
          app_location: coming-soon
          skip_app_build: true
          skip_api_build: true
